repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: pyright
        name: Pyright type check
        entry: python -m pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: unit-tests
        name: Unit tests
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        stages: [pre-push]
