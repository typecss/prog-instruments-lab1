[project]
name = "micrograd-quality-lab"
version = "0.1.0"
description = "Lab 1: Ruff, Pyright, Git hooks and GitHub Actions"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff==0.14.3", "pyright==1.1.407", "pre-commit==4.3.0"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
